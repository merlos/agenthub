[server]
# Loopback is intentional. Do not expose provider access to the network.
bind = "127.0.0.1"
port_start = 43100
port_end = 43999
# Maximum time to wait for a provider response, in seconds.
# Increase this for slow local models. Default: 1800 (30 minutes).
request_timeout_seconds = 1800

[privacy]
# WARNING: when true, complete prompts and responses are stored in agenthub.db.
log_conversations = false
