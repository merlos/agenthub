name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/check-release.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm ci --prefix website
      - run: npm run website:build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

  binaries:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
            triple: x86_64-pc-windows-msvc
          - target: windows-arm64
            runner: windows-11-arm
            triple: aarch64-pc-windows-msvc
          - target: macos-x64
            runner: macos-15-intel
            triple: x86_64-apple-darwin
          - target: macos-arm64
            runner: macos-15
            triple: aarch64-apple-darwin
          - target: debian-x64
            runner: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - target: debian-arm64
            runner: ubuntu-22.04-arm
            triple: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev
      - run: npm ci
      - name: Configure ad-hoc macOS signing
        if: runner.os == 'macOS' && vars.MACOS_SIGNING_ENABLED != 'true'
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
      - name: Configure Windows signing
        if: runner.os == 'Windows' && vars.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          if (!$env:WINDOWS_CERTIFICATE -or !$env:WINDOWS_CERTIFICATE_PASSWORD -or !$env:WINDOWS_TIMESTAMP_URL) {
            throw "Windows signing requires WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD, and WINDOWS_TIMESTAMP_URL."
          }
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certs = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $cert = @($certs | Where-Object { $_.HasPrivateKey })
            if ($cert.Count -ne 1) { throw "The PFX must contain exactly one signing certificate with a private key." }
            "SIGNING_THUMBPRINT=$($cert[0].Thumbprint)" >> $env:GITHUB_ENV
            $config = @{ bundle = @{ windows = @{
              certificateThumbprint = $cert[0].Thumbprint
              digestAlgorithm = "sha256"
              timestampUrl = $env:WINDOWS_TIMESTAMP_URL
              tsp = $true
            } } } | ConvertTo-Json -Depth 5 -Compress
            "TAURI_BUILD_CONFIG=$config" >> $env:GITHUB_ENV
          } finally {
            Remove-Item $pfx -ErrorAction SilentlyContinue
          }
      - name: Build package
        if: runner.os != 'macOS' || vars.MACOS_SIGNING_ENABLED != 'true'
        run: npm run package -- ${{ matrix.target }}
      - name: Build signed and notarized macOS package
        if: runner.os == 'macOS' && vars.MACOS_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required macOS signing credential: $name (check the step's repository secret mapping)"
              exit 1
            fi
          done
          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/apple-signing.XXXXXX")"
          trap 'rm -rf "$signing_dir"' EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$signing_dir/certificate.p12"
          export APPLE_API_KEY_PATH="$signing_dir/AuthKey.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
          openssl pkey -in "$APPLE_API_KEY_PATH" -noout
          APPLE_SIGNING_IDENTITY="$(
            openssl pkcs12 -in "$signing_dir/certificate.p12" -clcerts -nokeys -passin env:APPLE_CERTIFICATE_PASSWORD |
              openssl x509 -noout -subject -nameopt multiline |
              sed -n 's/^ *commonName *= *//p'
          )"
          if [[ "$APPLE_SIGNING_IDENTITY" != "Developer ID Application: "*" ($APPLE_TEAM_ID)" ]]; then
            echo "::error::The certificate must be a Developer ID Application certificate for APPLE_TEAM_ID."
            exit 1
          fi
          export APPLE_SIGNING_IDENTITY
          unset APPLE_API_PRIVATE_KEY
          npm run package -- ${{ matrix.target }}
      - name: Verify Windows installer signature
        if: runner.os == 'Windows' && vars.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          Get-ChildItem artifacts/*.msi | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Thumbprint -ne $env:SIGNING_THUMBPRINT) {
              throw "Installer signature verification failed."
            }
          }
      - name: Verify notarization
        if: runner.os == 'macOS' && vars.MACOS_SIGNING_ENABLED == 'true'
        run: |
          codesign --verify --deep --strict src-tauri/target/${{ matrix.triple }}/release/bundle/macos/*.app
          xcrun stapler validate src-tauri/target/${{ matrix.triple }}/release/bundle/macos/*.app
      - name: Remove Windows signing certificate
        if: always() && runner.os == 'Windows' && vars.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          if ($env:SIGNING_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$env:SIGNING_THUMBPRINT" -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            artifacts/*.msi
            artifacts/*.dmg
            artifacts/*.deb
          if-no-files-found: error
          retention-days: 14

  sources:
    needs: validate
    runs-on: ubuntu-24.04
    container: archlinux:base
    steps:
      - name: Install source packaging tools
        run: pacman -Syu --noconfirm --needed base-devel git nodejs npm
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Trust the checked-out workspace inside the container
        # Checkout's temporary Git configuration may not persist into shell steps.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: node scripts/check-release.mjs
      - run: npm run package:source
      - name: Build Arch source package as an unprivileged user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- npm run package:aur
      - name: Name Arch release artifact
        run: |
          version="${RELEASE_TAG#v}"
          mv "artifacts/aur/agenthub-${version}-1.src.tar.gz" "artifacts/aur/agenthub-${version}-1-arch.src.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: package-sources
          path: artifacts/aur/*-arch.src.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [validate, binaries, sources]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true
      - run: node scripts/prepare-release.mjs
      - name: Sign individual checksum files
        if: vars.RELEASE_GPG_SIGNING_ENABLED == 'true'
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          RELEASE_GPG_FINGERPRINT: ${{ vars.RELEASE_GPG_FINGERPRINT }}
          GNUPGHOME: ${{ runner.temp }}/release-gnupg
        run: |
          if [ -z "$RELEASE_GPG_PRIVATE_KEY" ] || [ -z "$RELEASE_GPG_PASSPHRASE" ] || [ -z "$RELEASE_GPG_FINGERPRINT" ]; then
            echo "::error::Missing release GPG signing key, passphrase, or fingerprint."
            exit 1
          fi
          mkdir -m 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent' EXIT
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          for checksum in release/*.sha256; do
            printf '%s' "$RELEASE_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --local-user "$RELEASE_GPG_FINGERPRINT" --armor --detach-sign --output "${checksum}.asc" "$checksum"
            gpg --verify "${checksum}.asc" "$checksum"
          done
          gpg --armor --export "$RELEASE_GPG_FINGERPRINT" > release/release-signing-key.asc
      - name: Attach artifacts to the existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
          WINDOWS_SIGNING_ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED }}
          RELEASE_GPG_SIGNING_ENABLED: ${{ vars.RELEASE_GPG_SIGNING_ENABLED }}
        run: |
          printf 'Installers for Windows, macOS, and Debian/Ubuntu; Arch is a source package only (not published to AUR).\n\nmacOS Developer ID signing/notarization: %s\nWindows Authenticode signing: %s\nGPG-signed individual checksum files: %s\n\nSee HOW-TO-RELEASE.md for verification and signing details.\n' \
            "${MACOS_SIGNING_ENABLED:-false}" "${WINDOWS_SIGNING_ENABLED:-false}" "${RELEASE_GPG_SIGNING_ENABLED:-false}" > release/SIGNING.txt
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "::error::Create a GitHub release for $RELEASE_TAG before uploading artifacts."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
